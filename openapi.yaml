openapi: 3.0.4
info:
  title: WHOIS Lookup
  description: >-
    WHOIS Lookup is a domain WHOIS API that reads the registry's RDAP or WHOIS
    record for any domain and returns the registrar, creation and expiry dates,
    nameservers, EPP status codes explained in plain English, transfer-lock and
    privacy flags, the registrant country where it is published, and domain age
    in days and years.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/whoislookup:
    get:
      summary: WHOIS Lookup
      description: Lookup domain registration data based on the domain name
      operationId: whoislookup
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          required: true
          description: >-
            The domain name for which you want to get the registration data
            (e.g., myspace.com)
          example: myspace.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  domainName: MYSPACE.COM
                  registryDomainID: 3877095_DOMAIN_COM-VRSN
                  createdDate: '1996-02-22T05:00:00Z'
                  expiryDate: '2029-02-23T05:00:00Z'
                  updatedDate: '2023-01-17T00:16:21Z'
                  domainStatus:
                    - >-
                      client delete prohibited https://icann.org/epp#client
                      delete prohibited
                    - >-
                      client renew prohibited https://icann.org/epp#client renew
                      prohibited
                    - >-
                      client transfer prohibited https://icann.org/epp#client
                      transfer prohibited
                    - >-
                      client update prohibited https://icann.org/epp#client
                      update prohibited
                  dNSSEC: unsigned
                  registrar: GoDaddy.com, LLC
                  registrarIANAID: '146'
                  registrarURL: http://www.godaddy.com
                  registrarAbuseContactEmail: abuse@godaddy.com
                  registrarAbuseContactPhone: tel:480-624-2505
                  nameServers:
                    - ns-cloud-a2.googledomains.com
                    - ns-cloud-a3.googledomains.com
                    - ns-cloud-a4.googledomains.com
                    - ns-cloud-a1.googledomains.com
                  statusDetails:
                    - code: clientDeleteProhibited
                      setBy: registrar
                      description: The registrar blocks deletion
                    - code: clientRenewProhibited
                      setBy: registrar
                      description: The registrar blocks renewal
                    - code: clientTransferProhibited
                      setBy: registrar
                      description: The registrar blocks transfer to another registrar
                    - code: clientUpdateProhibited
                      setBy: registrar
                      description: The registrar blocks changes to the record
                  isTransferLocked: true
                  isOnHold: false
                  isPendingDelete: false
                  registrantOrganization: Domains By Proxy, LLC
                  registrantCountry: US
                  isPrivacyProtected: true
                  domain: myspace.com
                  fetchedAtUTC: '2025-12-17T01:54:05.069Z'
                  tld: com
                  status: active
                  domainAgeDays: 11094
                  domainAgeYears: 30.4
                  isRecentlyRegistered: false
                  trustScore: 93
                  trustLevel: high
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
